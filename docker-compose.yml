version: '3.8'

services:
  oracle-db:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: oracle-biblioteca
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      - ORACLE_PWD=system123
      - ORACLE_CHARACTERSET=AL32UTF8
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./database:/docker-entrypoint-initdb.d/setup
    networks:
      - biblioteca-network
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "system/system123@//localhost:1521/XE", "@/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5

  funcion-usuarios:
    build:
      context: ./funcion-usuarios
      dockerfile: Dockerfile
    container_name: funcion-usuarios
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DB_URL=jdbc:oracle:thin:@oracle-db:1521:XE
      - DB_USER=system
      - DB_PASSWORD=system123
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - biblioteca-network
    restart: unless-stopped

  funcion-prestamos:
    build:
      context: ./funcion-prestamos
      dockerfile: Dockerfile
    container_name: funcion-prestamos
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - DB_URL=jdbc:oracle:thin:@oracle-db:1521:XE
      - DB_USER=system
      - DB_PASSWORD=system123
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - biblioteca-network
    restart: unless-stopped

  microservicio-bff:
    build:
      context: ./microservicio-bff
      dockerfile: Dockerfile
    container_name: microservicio-bff
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - USUARIOS_SERVICE_URL=http://funcion-usuarios:8081
      - PRESTAMOS_SERVICE_URL=http://funcion-prestamos:8082
    depends_on:
      - funcion-usuarios
      - funcion-prestamos
    networks:
      - biblioteca-network
    restart: unless-stopped

volumes:
  oracle-data:

networks:
  biblioteca-network:
    driver: bridge
