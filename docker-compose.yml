version: '3.8'

services:
  funcion-usuarios:
    build:
      context: ./funcion-usuarios
      dockerfile: Dockerfile
    container_name: funcion-usuarios
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER:-biblioteca}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - biblioteca-network
    restart: unless-stopped

  funcion-prestamos:
    build:
      context: ./funcion-prestamos
      dockerfile: Dockerfile
    container_name: funcion-prestamos
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - DB_URL=${DB_URL}
      - DB_USER=${DB_USER:-biblioteca}
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      - biblioteca-network
    restart: unless-stopped

  microservicio-bff:
    build:
      context: ./microservicio-bff
      dockerfile: Dockerfile
    container_name: microservicio-bff
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - USUARIOS_SERVICE_URL=http://funcion-usuarios:8081
      - PRESTAMOS_SERVICE_URL=http://funcion-prestamos:8082
    depends_on:
      - funcion-usuarios
      - funcion-prestamos
    networks:
      - biblioteca-network
    restart: unless-stopped

networks:
  biblioteca-network:
    driver: bridge
